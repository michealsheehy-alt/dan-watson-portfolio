name: Finalize DWTS TikTok Cards

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: startsWith(github.event.issue.title, '[finalize-tiktok]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalize cards
        run: node scripts/finalize-tiktok-cards.mjs

      - name: Commit final site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish new DWTS TikTok cards"
          git push origin HEAD:main
