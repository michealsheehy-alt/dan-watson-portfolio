name: DWTS Card Repair

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[dwts-card-fix]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch real TikTok covers and fix cards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const clips = [
            { id: '7675108230372085006', title: 'The siblings are fighting. 😉', views: '372.8K views' },
            { id: '7677226421764263181', title: "Safe to say Selena isn't on Jan's DTM list 🤭", views: '530.7K views' },
            { id: '7665429077339213070', title: 'That performance was something special ❤️', views: '52.8K views' },
            { id: '7670021280816549133', title: "Tonight's episode of #DWTSNextPro was a roller coaster 🎢", views: '110.3K views' },
          ];

          function htmlEscape(s) {
            return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          }

          let page = fs.readFileSync('app/page.tsx', 'utf8');
          let html = fs.readFileSync('index.html', 'utf8');

          fs.mkdirSync('public/images/reel', { recursive: true });
          fs.mkdirSync('images/reel', { recursive: true });

          (async () => {
            for (const clip of clips) {
              const videoUrl = `https://www.tiktok.com/@officialdwts/video/${clip.id}`;
              const oembed = await fetch(`https://www.tiktok.com/oembed?url=${encodeURIComponent(videoUrl)}`, {
                headers: { 'user-agent': 'Mozilla/5.0', accept: 'application/json' },
              });
              if (!oembed.ok) throw new Error(`oEmbed failed for ${clip.id}: ${oembed.status}`);
              const meta = await oembed.json();
              if (!meta.thumbnail_url) throw new Error(`No thumbnail for ${clip.id}`);

              const imageResponse = await fetch(meta.thumbnail_url, { headers: { 'user-agent': 'Mozilla/5.0' } });
              if (!imageResponse.ok) throw new Error(`Thumbnail failed for ${clip.id}: ${imageResponse.status}`);
              const bytes = Buffer.from(await imageResponse.arrayBuffer());
              const filename = `dwts-${clip.id}.jpg`;
              fs.writeFileSync(path.join('public/images/reel', filename), bytes);
              fs.writeFileSync(path.join('images/reel', filename), bytes);

              const blockPattern = new RegExp(`  \\{\\n    id: "${clip.id}"[\\s\\S]*?\\n  \\},`);
              const newBlock = `  {\n    id: "${clip.id}",\n    title: ${JSON.stringify(clip.title)},\n    views: ${JSON.stringify(clip.views)},\n    image: "/images/reel/${filename}",\n    imageAlt: ${JSON.stringify(`TikTok cover for ${clip.title}`)},\n  },`;
              if (!blockPattern.test(page)) throw new Error(`Source card not found for ${clip.id}`);
              page = page.replace(blockPattern, newBlock);

              const anchorPattern = new RegExp(`<a class="reel-card reel-card-tiktok" href="https://www\\.tiktok\\.com/@officialdwts/video/${clip.id}"[\\s\\S]*?</a>`);
              const title = htmlEscape(clip.title);
              const alt = htmlEscape(`TikTok cover for ${clip.title}`);
              const newAnchor = `<a class="reel-card reel-card-tiktok" href="${videoUrl}" rel="noreferrer" target="_blank"><div class="reel-card-image"><img alt="${alt}" loading="lazy" src="/images/reel/${filename}"/><span class="reel-card-play" aria-hidden="true">▶</span></div><div class="reel-card-copy"><div class="reel-card-meta"><span>DWTS: The Next Pro / TikTok</span><span>${clip.views}</span></div><h4>${title}</h4><p>Produced by Dan Watson <span aria-hidden="true">↗</span></p></div></a>`;
              if (!anchorPattern.test(html)) throw new Error(`Static card not found for ${clip.id}`);
              html = html.replace(anchorPattern, newAnchor);
            }

            fs.writeFileSync('app/page.tsx', page);
            fs.writeFileSync('index.html', html);

            let layout = fs.readFileSync('app/layout.tsx', 'utf8');
            layout = layout.replace('import "./tiktok-overrides.css";\n', '');
            fs.writeFileSync('app/layout.tsx', layout);

            let siteCss = fs.readFileSync('assets/site.css', 'utf8');
            siteCss = siteCss.replace("@import url('/assets/tiktok-card-overrides.css?v=20260826-dwts');\n", '');
            fs.writeFileSync('assets/site.css', siteCss);

            for (const file of ['app/tiktok-overrides.css', 'assets/tiktok-card-overrides.css', '.github/workflows/tiktok-probe.yml']) {
              try { fs.rmSync(file); } catch {}
            }
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE

      - name: Commit repaired cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix DWTS TikTok cards with correct covers and metadata"
          git push origin HEAD:main
