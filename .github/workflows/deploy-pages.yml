name: Apply Dan hero headline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply Dan headline change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          old = '''          <h1>\n            Built for broadcast.\n            <br />\n            Bred for the feed.\n          </h1>'''
          new = '''          <h1>\n            Built in prime time.\n            <br />\n            Fluent in social!\n          </h1>'''
          if old not in page:
              raise SystemExit('Old hero headline not found in source')
          page_path.write_text(page.replace(old, new, 1))

          static_path = Path('index.html')
          static = static_path.read_text()
          old_static = '<h1>Built for broadcast.<br/>Bred for the feed.</h1>'
          new_static = '<h1>Built in prime time.<br/>Fluent in social!</h1>'
          if old_static in static:
              static_path.write_text(static.replace(old_static, new_static, 1))
          PY

      - name: Commit source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx index.html
          git commit -m "Update Dan hero headline"
          git push origin HEAD:main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:github-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
